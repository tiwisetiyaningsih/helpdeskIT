services:

  mysql:
    image: mysql:8
    container_name: helpdesk-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql


  redis:
    image: redis:7
    container_name: helpdesk-redis
    restart: always
    ports:
      - "6380:6379"


  minio:
    image: quay.io/minio/minio
    container_name: helpdesk-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data


  backend:
    build: ./backend
    container_name: helpdesk-backend
    restart: always

    command: bun run dev

    ports:
      - "3001:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - mysql
      - redis
      - minio


  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    restart: always

    command: npm run dev

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      WATCHPACK_POLLING: "true"

    depends_on:
      - backend


volumes:
  mysql_data:
  minio_data: